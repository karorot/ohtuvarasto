{% extends "base.html" %}

{% block title %}Luo uusi varasto{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-6">Luo uusi varasto</h1>
    
    <form method="POST" class="bg-white rounded-lg shadow-md p-6">
        <div class="mb-4">
            <label for="nimi" class="block text-gray-700 font-medium mb-2">
                Varaston nimi
            </label>
            <input type="text" id="nimi" name="nimi" required
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="esim. Mehuvarasto">
        </div>
        
        <div class="mb-4">
            <label for="tilavuus" class="block text-gray-700 font-medium mb-2">
                Kapasiteetti
            </label>
            <input type="number" id="tilavuus" name="tilavuus" required min="0.1" step="0.1"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="esim. 100">
        </div>
        
        <div class="mb-6">
            <label for="alku_saldo" class="block text-gray-700 font-medium mb-2">
                Alkusaldo (valinnainen)
            </label>
            <input type="number" id="alku_saldo" name="alku_saldo" min="0" step="0.1" value="0"
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="0">
        </div>
        
        <div class="flex gap-3">
            <button type="submit" 
                    class="flex-1 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                Luo varasto
            </button>
            <a href="{{ url_for('index') }}" 
               class="flex-1 bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400 text-center">
                Peruuta
            </a>
        </div>
    </form>
</div>
{% endblock %}
